services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: ${JELLYFIN_CONTAINER_NAME:-jellyfin}
    ports:
      - ${JELLYFIN_PORT:-8096}:8096
    volumes:
      - ${JELLYFIN_CONFIG:-/home/trip/jellyfin/config}:/config
      - ${TORRENTS_DIR:-/mnt/ssd/torrents}:/data/media:rw
    environment:
      - TZ=${TZ:-Europe/Kyiv}
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: ${QBITTORRENT_CONTAINER_NAME:-qbittorrent}
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Kyiv}
      - WEBUI_PORT=${WEBUI_PORT:-8080}
      - TORRENTING_PORT=${TORRENT_PORT:-6881}
    volumes:
      - ${QBITTORRENT_CONFIG:-/mnt/ssd/qbittorrent/config}:/config
      - ${STORAGE_DIR:-/mnt/ssd}:/data
    ports:
      - ${WEBUI_PORT:-8080}:${WEBUI_PORT:-8080}
      - ${TORRENT_PORT:-6881}:${TORRENT_PORT:-6881}
      - ${TORRENT_PORT:-6881}:${TORRENT_PORT:-6881}/udp
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    container_name: ${NAVIDROME_CONTAINER_NAME:-navidrome}
    user: ${PUID:-1000}:${PGID:-1000}
    ports:
      - ${NAVIDROME_PORT:-4533}:4533
    environment:
      ND_LOGLEVEL: ${ND_LOGLEVEL:-info}
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_SCANINTERVAL: 1m
      ND_LASTFM_APIKEY: ${ND_LASTFM_APIKEY}
      ND_LASTFM_SECRET: ${ND_LASTFM_SECRET}
    volumes:
      - ${NAVIDROME_DATA:-/home/trip/navidrome/data}:/data
      - ${NAVIDROME_MUSIC:-/home/trip/navidrome/navidrome_music}:/music:ro
    restart: unless-stopped
