services:
  stirling-pdf:
    image: frooodle/s-pdf:latest
    container_name: ${STIRLING_CONTAINER_NAME:-stirling-pdf}
    ports:
      - "${STIRLING_PORT:-3010}:8080"
    volumes:
      - ${STIRLING_TESSDATA:-/home/trip/stirling-pdf/tessdata}:/usr/share/tessdata
    environment:
      # Мови для OCR — встановлюються в образ при старті.
      # Не потрібні, якщо кладеш .traineddata напряму в STIRLING_TESSDATA.
      # TESSERACT_LANGS: eng,ukr
      # LANGS: en_GB,uk_UA
    restart: unless-stopped

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: ${LIBRETRANSLATE_CONTAINER_NAME:-libretranslate}
    ports:
      - "${LIBRETRANSLATE_PORT:-3020}:5000"
    environment:
      # Моделі перекладу, які завантажуються при першому старті (кожна ~сотні МБ)
      - LT_LOAD_ONLY=${LT_LOAD_ONLY:-uk,en}
    volumes:
      - libre-trans_lt-local:/home/libretranslate/.local
    restart: unless-stopped

volumes:
  libre-trans_lt-local:
    external: true
