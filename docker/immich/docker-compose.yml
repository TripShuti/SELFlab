services:
  immich-server:
    container_name: ${IMMICH_CONTAINER_NAME:-immich_server}
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${IMMICH_UPLOAD:-/home/trip/immich-app/upload}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_DATABASE_NAME=${DB_NAME:-immich}
      - DB_HOSTNAME=${DB_CONTAINER_NAME:-immich_postgres}
      - REDIS_HOSTNAME=${REDIS_CONTAINER_NAME:-immich_redis}
    ports:
      - '${IMMICH_PORT:-2283}:2283'
    depends_on:
      - redis
      - database
    restart: always

  redis:
    container_name: ${REDIS_CONTAINER_NAME:-immich_redis}
    image: docker.io/valkey/valkey:9
    restart: always

  database:
    container_name: ${DB_CONTAINER_NAME:-immich_postgres}
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_NAME:-immich}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${IMMICH_POSTGRES:-/home/trip/immich-app/postgres}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
