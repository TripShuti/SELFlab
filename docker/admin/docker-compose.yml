services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: ${VAULTWARDEN_CONTAINER_NAME:-vaultwarden}
    ports:
      - "${VAULTWARDEN_PORT:-8192}:80"
    volumes:
      - ${VAULTWARDEN_DATA:-/home/trip/vaultwarden}:/data
    environment:
      - TZ=${TZ:-Europe/Kyiv}
      # Домен, з якого заходиш (потрібен мобільному додатку Bitwarden)
      - DOMAIN=${VAULTWARDEN_DOMAIN:-http://vault.home:8192}
      # Перший запуск: true → створити акаунт у UI → перемкнути на false
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED:-false}
      # Адмін-панель (опційно): `openssl rand -base64 48`
      # - ADMIN_TOKEN=${ADMIN_TOKEN}
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: ${UPTIME_KUMA_CONTAINER_NAME:-uptime-kuma}
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    extra_hosts:
      # Внутрішні домени резолвляться локально, щоб не спамити DNS (Pi-hole)
      - "vault.home:${LAN_IP:-192.168.1.110}"
      - "jellyfin.home:${LAN_IP:-192.168.1.110}"
      - "qbittorrent.home:${LAN_IP:-192.168.1.110}"
      - "navidrome.home:${LAN_IP:-192.168.1.110}"
      - "immich.home:${LAN_IP:-192.168.1.110}"
      - "stirling.home:${LAN_IP:-192.168.1.110}"
      - "kuma.home:${LAN_IP:-192.168.1.110}"
      - "kopia.home:${LAN_IP:-192.168.1.110}"
      - "homepage.home:${LAN_IP:-192.168.1.110}"
      - "searxng.home:${LAN_IP:-192.168.1.110}"
    volumes:
      - ${UPTIME_KUMA_DATA:-/home/trip/uptime-kuma}:/app/data
      # Кореневий сертифікат Caddy — щоб монітори довіряли https://*.home:8443
      - ${CADDY_DATA:-/home/trip/caddy/data}/caddy/pki/authorities/local/root.crt:/etc/caddy-ca/root.crt:ro
    environment:
      - NODE_EXTRA_CA_CERTS=/etc/caddy-ca/root.crt
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: ${CADDY_CONTAINER_NAME:-caddy}
    ports:
      - "${CADDY_PORT:-8443}:443"
    extra_hosts:
      # Доступ до опублікованих портів інших стеків на хості
      - "host.docker.internal:host-gateway"
    volumes:
      - ${CADDY_CONFIG:-/home/trip/caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA:-/home/trip/caddy/data}:/data
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: ${HOMEPAGE_CONTAINER_NAME:-homepage}
    ports:
      # Homepage слухає 3000 всередині; зовні 3002 (3000 зайнятий Dockhand)
      - "${HOMEPAGE_PORT:-3002}:3000"
    extra_hosts:
      # Доступ до API-портів інших стеків на хості (віджети)
      - "host.docker.internal:host-gateway"
      # Внутрішні домени резолвляться локально, щоб не спамити DNS (Pi-hole)
      - "vault.home:${LAN_IP:-192.168.1.110}"
      - "jellyfin.home:${LAN_IP:-192.168.1.110}"
      - "qbittorrent.home:${LAN_IP:-192.168.1.110}"
      - "navidrome.home:${LAN_IP:-192.168.1.110}"
      - "immich.home:${LAN_IP:-192.168.1.110}"
      - "stirling.home:${LAN_IP:-192.168.1.110}"
      - "kuma.home:${LAN_IP:-192.168.1.110}"
      - "kopia.home:${LAN_IP:-192.168.1.110}"
      - "homepage.home:${LAN_IP:-192.168.1.110}"
      - "searxng.home:${LAN_IP:-192.168.1.110}"
      - "dockhand.home:${LAN_IP:-192.168.1.110}"
      - "wishes.home:${LAN_IP:-192.168.1.110}"
      - "psn.home:${LAN_IP:-192.168.1.110}"
    volumes:
      - ${HOMEPAGE_CONFIG:-/home/trip/homepage}:/app/config
    environment:
      - TZ=${TZ:-Europe/Kyiv}
      # Host-валідація: пускати тільки ці Host-заголовки (з портом!)
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS:-homepage.home:8443,${LAN_IP:-192.168.1.110}:3002,127.0.0.1:3002}
      # Секрети віджетів з Dockhand env → у контейнер (щоб не були "unused")
      - HOMEPAGE_VAR_JELLYFIN_KEY=${HOMEPAGE_VAR_JELLYFIN_KEY:-}
      - HOMEPAGE_VAR_QBITTORRENT_USERNAME=${HOMEPAGE_VAR_QBITTORRENT_USERNAME:-}
      - HOMEPAGE_VAR_QBITTORRENT_PASSWORD=${HOMEPAGE_VAR_QBITTORRENT_PASSWORD:-}
      - HOMEPAGE_VAR_PIHOLE_TOKEN=${HOMEPAGE_VAR_PIHOLE_TOKEN:-}
      - HOMEPAGE_VAR_TAILSCALE_KEY=${HOMEPAGE_VAR_TAILSCALE_KEY:-}
      - HOMEPAGE_VAR_TAILSCALE_TAILNET=${HOMEPAGE_VAR_TAILSCALE_TAILNET:-}
      - HOMEPAGE_VAR_TAILSCALE_DEVICEID=${HOMEPAGE_VAR_TAILSCALE_DEVICEID:-}
      - HOMEPAGE_VAR_IMMICH_KEY=${HOMEPAGE_VAR_IMMICH_KEY:-}
    restart: unless-stopped

  glances:
    image: nicolargo/glances:latest
    container_name: ${GLANCES_CONTAINER_NAME:-glances}
    environment:
      # REST API без веб-UI (живить віджет системного моніторингу в homepage)
      - GLANCES_OPT=-w --disable-webui
    volumes:
      # ОС хоста, а не контейнера; /sys — температура CPU (hwmon)
      - /etc/os-release:/etc/os-release:ro
      - /sys:/sys:ro
      # Диски хоста: без цих bind-mount glances бачить лише mount-точки контейнера
      - /:/mnt/root:ro
      - /mnt/ssd:/mnt/ssd:ro
    pid: host
    restart: unless-stopped

  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    container_name: ${SEARXNG_CONTAINER_NAME:-searxng}
    ports:
      # Всередині завжди 8080; зовні 8081 (8080 зайнятий qBittorrent)
      - "${SEARXNG_PORT:-8081}:8080"
    volumes:
      # Перший старт: директорія має існувати і належати 977:977 (юзер searxng
      # всередині образу), інакше entrypoint падає з "Permission denied":
      #   mkdir -p /home/trip/searxng
      #   curl -fsSL https://raw.githubusercontent.com/TripShuti/SELFlab/main/docker/admin/searxng/settings.yml -o /home/trip/searxng/settings.yml
      #   curl -fsSL https://raw.githubusercontent.com/TripShuti/SELFlab/main/docker/admin/searxng/limiter.toml -o /home/trip/searxng/limiter.toml
      #   sudo chown -R 977:977 /home/trip/searxng
      - ${SEARXNG_CONFIG:-/home/trip/searxng}:/etc/searxng:rw
    environment:
      # Слєш в кінці обов'язковий, інакше ламаються пагінація і редіректи
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-https://searxng.home:8443/}
      # openssl rand -hex 32 → тільки Dockhand env, не в репо
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    # БЕЗ cap_drop: ламає створення settings.yml на першому старті (апстрім-баг searxng-docker#252).
    # Офіційний compose-темалейт теж без caps.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      searxng-valkey:
        condition: service_healthy
    restart: unless-stopped

  searxng-valkey:
    image: ${SEARXNG_VALKEY_IMAGE:-valkey/valkey:9-alpine}
    container_name: ${SEARXNG_VALKEY_CONTAINER_NAME:-searxng-valkey}
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - searxng-valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  kopia:
    image: kopia/kopia:latest
    container_name: ${KOPIA_CONTAINER_NAME:-kopia}
    # Без hostname контейнер отримує випадкове ім'я, яке записується в конфіг
    hostname: ${KOPIA_HOSTNAME:-kopia}
    ports:
      - "${KOPIA_PORT:-51515}:51515"
    command:
      - server
      - start
      - --disable-csrf-token-checks
      - --insecure
      - --address=0.0.0.0:51515
      - --server-username=${KOPIA_SERVER_USERNAME:-kopia}
      - --server-password=${KOPIA_SERVER_PASSWORD:-changeme}
    environment:
      - TZ=${TZ:-Europe/Kyiv}
      # Пароль шифрування репозиторію — вводиться при створенні репо в UI,
      # без нього бекапи неможливо відновити
      - KOPIA_PASSWORD=${KOPIA_PASSWORD}
    volumes:
      - ${KOPIA_CONFIG:-/home/trip/kopia/config}:/app/config
      - ${KOPIA_CACHE:-/home/trip/kopia/cache}:/app/cache
      - ${KOPIA_LOGS:-/home/trip/kopia/logs}:/app/logs
      # rclone-конфіг для бекапу в Google Drive (remote gdrive)
      - ${KOPIA_RCLONE_CONFIG:-/home/trip/kopia/rclone.conf}:/app/rclone/rclone.conf:ro
      # Джерела для бекапу (read-only) - тільки потрібні сервіси
      - ${VAULTWARDEN_DATA:-/home/trip/vaultwarden}:/sources/vaultwarden:ro
      - ${HOMEPAGE_CONFIG:-/home/trip/homepage}:/sources/homepage:ro
      - ${SEARXNG_CONFIG:-/home/trip/searxng}:/sources/searxng:ro
      - ${PSNSELF_CONFIG:-/home/trip/.config/psnself}:/sources/psnself:ro
      - ${SELFWISHES_DATA:-/opt/selfwishes/data}:/sources/selfwishes:ro
    restart: unless-stopped

volumes:
  searxng-valkey-data:
