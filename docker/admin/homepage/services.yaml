- Admin:
    - Dockhand:
        href: https://dockhand.home:8443/stacks
        description: Керування контейнерами
        icon: dockhand
    - Pi-hole:
        href: https://pi-hole.home:8443/admin/
        description: DNS-фільтр і реклама
        icon: pi-hole
        widget:
          type: pihole
          url: http://host.docker.internal:80
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_TOKEN}}"
    - Tailscale:
        href: https://login.tailscale.com/admin/machines
        description: VPN-мережа
        icon: tailscale
        widget:
          type: tailscale
          url: https://api.tailscale.com
          key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"
          tailnet: "{{HOMEPAGE_VAR_TAILSCALE_TAILNET}}"
          deviceid: "{{HOMEPAGE_VAR_TAILSCALE_DEVICEID}}"
    - Vaultwarden:
        href: https://vault.home:8443
        description: Менеджер паролів
        icon: bitwarden
    - Kopia:
        href: https://kopia.home:8443
        description: Бекапи в Google Drive
        icon: kopia
    - SearXNG:
        href: https://searxng.home:8443
        description: Приватний метапошук
        icon: searxng


- Media:
    - Jellyfin:
        href: https://jellyfin.home:8443
        description: Фільми і серіали
        icon: jellyfin
        widget:
          type: jellyfin
          url: http://host.docker.internal:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          version: 2 # optional, default is 1
          enableBlocks: true # optional, defaults to false
          enableNowPlaying: true # optional, defaults to true
          enableUser: true # optional, defaults to false
          enableMediaControl: true # optional, defaults to true
          showEpisodeNumber: true # optional, defaults to false
          expandOneStreamToTwoRows: true # optional, defaults to true
    - Navidrome:
        href: https://navidrome.home:8443
        description: Музика
        icon: navidrome
        widget:
          type: navidrome
          url: http://192.168.1.110:4533/
          user: trip
          token: 181ce158cbe4493e019724151a492b55
          salt: x8k19p
    - qBittorrent:
        href: https://qbittorrent.home:8443
        description: Торенти
        icon: qbittorrent
        widget:
          type: qbittorrent
          url: http://host.docker.internal:8080
          username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
          password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"
    - Immich:
        href: https://immich.home:8443
        description: Галерея фото
        icon: immich
        widget:
          type: immich
          url: http://host.docker.internal:2283
          version: 2
          key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"


