- Media:
    - Jellyfin:
        href: https://jellyfin.home:8443
        description: Фільми і серіали
        icon: jellyfin
        widget:
          type: jellyfin
          url: http://host.docker.internal:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
    - Navidrome:
        href: https://navidrome.home:8443
        description: Музика
        icon: navidrome
    - qBittorrent:
        href: https://qbittorrent.home:8443
        description: Торенти
        icon: qbittorrent
        widget:
          type: qbittorrent
          url: http://host.docker.internal:8080
          username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
          password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"
    - Immich:
        href: https://immich.home:8443
        description: Галерея фото
        icon: immich
        widget:
          type: immich
          url: http://host.docker.internal:2283
          version: 2
          key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"

- Network:
    - Pi-hole:
        href: http://192.168.1.110/admin
        description: DNS-фільтр і реклама
        icon: pi-hole
        widget:
          type: pihole
          url: http://host.docker.internal:80
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_TOKEN}}"
    - Tailscale:
        href: https://login.tailscale.com/admin/machines
        description: VPN-мережа
        icon: tailscale
        widget:
          type: tailscale
          url: https://api.tailscale.com
          key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"
          tailnet: "{{HOMEPAGE_VAR_TAILSCALE_TAILNET}}"
          deviceid: "{{HOMEPAGE_VAR_TAILSCALE_DEVICEID}}"

- Admin:
    - Dockhand:
        href: http://dockhand.home:3000/stacks
        description: Керування контейнерами
        icon: dockhand
    - Vaultwarden:
        href: https://vault.home:8443
        description: Менеджер паролів
        icon: bitwarden
    - Uptime Kuma:
        href: https://kuma.home:8443
        description: Моніторинг
        icon: uptime-kuma
    - Kopia:
        href: https://kopia.home:8443
        description: Бекапи в Google Drive
        icon: kopia
    - Stirling PDF:
        href: https://stirling.home:8443
        description: Робота з PDF
        icon: stirling-pdf
